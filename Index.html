<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timeline</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 1080px;
      height: 1920px;
      margin: 0 auto;
      overflow: hidden;
      border: 5px solid rgb(0, 0, 0);
    }
    .scroll-container {
      width: 100%;
      height: 100%;
      overflow-y: scroll;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .scroll-container::-webkit-scrollbar {
      display: none;
    }
    .scroll-content {
      display: flex;
      flex-direction: column;
    }
    .card {
      width: 100%;
      height: calc(1920px / 3);
      flex-shrink: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    .c1 { background-image: url('Img/1950s.jpg'); }
    .c2 { background-image: url('Img/1960s.jpg'); }
    .c3 { background-image: url('Img/1970s.jpg'); }
    .c4 { background-image: url('Img/1980s.jpg'); }
    .c5 { background-image: url('Img/1990s.jpg'); }
    .c6 { background-image: url('Img/2000s.jpg'); }
    .c7 { background-image: url('Img/2010s.jpg'); }
    .c8 { background-image: url('Img/2020s.jpg'); }
  </style>
</head>
<body>
  <div class="scroll-container" id="scrollContainer">
    <div class="scroll-content" id="scrollContent">
      <div class="card c1"></div>
      <div class="card c2"></div>
      <div class="card c3"></div>
      <div class="card c4"></div>
      <div class="card c5"></div>
      <div class="card c6"></div>
      <div class="card c7"></div>
      <div class="card c8"></div>
    </div>
  </div>

  <script>
    const container = document.getElementById('scrollContainer');
    const content = document.getElementById('scrollContent');

    content.innerHTML += content.innerHTML;

    let isAutoScrolling = true;
    const speed = 2;

    function autoScroll() {
      if (isAutoScrolling) {
        container.scrollTop += speed;
      }

      if (container.scrollTop >= content.scrollHeight / 2) {
        container.scrollTop -= content.scrollHeight / 2;
      } else if (container.scrollTop <= 0) {
        container.scrollTop += content.scrollHeight / 2;
      }

      requestAnimationFrame(autoScroll);
    }

    container.addEventListener('scroll', () => {
      if (container.scrollTop >= content.scrollHeight / 2) {
        container.scrollTop -= content.scrollHeight / 2;
      } else if (container.scrollTop <= 0) {
        container.scrollTop += content.scrollHeight / 2;
      }
    });

    autoScroll();
  </script>
</body>
</html>
